server {
    listen 80;
    server_name localhost;

    # ── API → Laravel Sail (puerto 80 interno de Sail) ────────────
    location /api {
        proxy_pass http://laravel.test:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sanctum CSRF cookie (necesario para autenticación)
    location /sanctum {
        proxy_pass http://laravel.test:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Frontend → Angular ng serve (puerto 4200) ─────────────────
    location / {
        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;

        # WebSockets — imprescindible para el hot-reload de Angular
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
